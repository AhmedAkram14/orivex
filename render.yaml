# Render Blueprint (Sprint 14 -- First Production Deployment).
# Connect this repo in the Render dashboard ("New +" -> "Blueprint") and
# Render reads this file to provision the services below. Docker build
# uses the existing production Dockerfile from Sprint 13 unchanged --
# nothing about the image itself is Render-specific.
#
# Do NOT set PORT in envVars below -- Render injects its own PORT value
# for Docker-based web services, and main.ts already reads whatever
# process.env.PORT is present via the validated config service.
#
# Render's product/schema naming for secondary services (e.g. its Redis/
# "Key Value" offering) has changed over time -- this Blueprint only
# declares what's stable across Render's history (a Docker web service and
# a managed Postgres database). Provision Redis and S3-compatible storage
# separately (see DEPLOYMENT.md) and paste their real connection details
# into the dashboard's environment variable editor for the values marked
# sync: false below. JWT_ACCESS_SECRET is generated by Render itself
# (generateValue) -- authentication is first-party (no external IdP).
#
# orivex-postgres below is provisioned on Render's free plan but
# deliberately unused: the actual database is Neon Postgres (external),
# wired via DATABASE_URL's sync: false entry, not via fromDatabase.

databases:
  - name: orivex-postgres
    databaseName: orivex
    user: orivex
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: orivex-backend
    runtime: docker
    dockerfilePath: ./apps/backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health/readiness
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: OTEL_ENABLED
        value: "false"
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: OPENAPI_ENABLED
        value: "false"
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENDGRID_FROM_EMAIL
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_FORCE_PATH_STYLE
        sync: false
