services:
  postgres:
    image: postgres:16-alpine
    container_name: orivex-postgres
    environment:
      POSTGRES_DB: orivex
      POSTGRES_USER: orivex
      POSTGRES_PASSWORD: orivex
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orivex -d orivex"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: orivex-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.20
    container_name: orivex-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: orivex-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: orivex
      MINIO_ROOT_PASSWORD: orivex-dev-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - minio-data:/data

  # One-shot bootstrap, not a long-running service: creates the S3_BUCKET
  # AssetModule/HealthController's readiness check expect
  # (`orivex-media-assets`, matching S3_BUCKET in .env.development/
  # .env.example) so a fresh `pnpm docker:up` is immediately usable --
  # nothing else in this repo ever provisioned it, which previously left
  # GET /health/readiness reporting "object storage unreachable" until
  # someone created the bucket by hand in the MinIO console. Waits for
  # MinIO's own healthcheck (not just "container started") before running,
  # runs once, then exits -- `restart: "no"` keeps it from looping.
  # `--ignore-existing` makes this safe to run again on every `docker:up`
  # (e.g. against the same named volume) without erroring if the bucket is
  # already there.
  minio-init:
    image: minio/mc:latest
    container_name: orivex-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - "mc alias set local http://minio:9000 orivex orivex-dev-secret && mc mb --ignore-existing local/orivex-media-assets"
    restart: "no"

volumes:
  postgres-data:
  minio-data:
