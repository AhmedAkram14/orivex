services:
  postgres:
    image: postgres:16-alpine
    container_name: orivex-postgres
    environment:
      POSTGRES_DB: orivex
      POSTGRES_USER: orivex
      POSTGRES_PASSWORD: orivex
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orivex -d orivex"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: orivex-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.20
    container_name: orivex-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: orivex-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: orivex
      MINIO_ROOT_PASSWORD: orivex-dev-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
