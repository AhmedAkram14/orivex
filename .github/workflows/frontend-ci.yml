name: Frontend CI

# Mirrors backend-ci.yml's shape (Production Readiness Audit -- "add
# frontend CI workflow"). Hard gates only, no deploy step: this workflow
# never publishes anything or touches any environment. E2E is a separate
# job since it needs a browser install and a built app, not just node_modules.
on:
  push:
    branches: [main]
    paths:
      - "apps/frontend/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "apps/frontend/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/frontend-ci.yml"

jobs:
  verify:
    name: Install, lint, typecheck, test, build, storybook build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @orivex/frontend...

      - name: Lint
        run: pnpm --filter @orivex/frontend run lint

      - name: Typecheck
        run: pnpm --filter @orivex/frontend run typecheck

      - name: Test
        run: pnpm --filter @orivex/frontend run test

      - name: Build
        # NEXT_PUBLIC_API_BASE_URL is required (src/shared/lib/env.ts fails
        # fast on a missing value) purely so `next build` can statically
        # render pages that read it (e.g. app/robots.ts's env.appUrl) --
        # this workflow never deploys anything, so the value itself is a
        # throwaway placeholder, same as .env.example's local-dev default.
        run: pnpm --filter @orivex/frontend run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:4000

      - name: Storybook build
        run: pnpm --filter @orivex/frontend run build-storybook

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @orivex/frontend...

      - name: Install Playwright browsers
        run: pnpm --filter @orivex/frontend exec playwright install --with-deps chromium

      - name: Run E2E tests
        # Runs against MSW-mocked API responses, not a live backend/DB --
        # see playwright.config.ts's comments for why (this workflow has no
        # Postgres/S3 provisioned, matching the local dev trade-off).
        run: pnpm --filter @orivex/frontend run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/frontend/playwright-report/
          retention-days: 7

  e2e-real-stack:
    # N1 -- real-stack E2E coverage (ORIVEX Remaining Work Audit): the `e2e`
    # job above proves the UI against MSW; this job instead builds the
    # frontend with mocks OFF and runs it against a genuinely live NestJS
    # backend + real Postgres, exercising the actual frontend<->backend<->
    # database seam the mocked suite never touches. Scoped to exactly
    # tests/e2e/real-stack-smoke.spec.ts -- every other spec in this
    # directory depends on MSW-only seams (window.__mockScheduling, etc.)
    # that do not exist against a real backend and would fail here, not
    # because anything is broken but because they were never written for
    # this mode (see real-stack-smoke.spec.ts's own header comment).
    #
    # Stripe/LiveKit: intentionally left unset. Both are optional at the
    # backend's own config layer (env.schema.ts), so the app boots and
    # this spec's login/real-data-rendering path runs correctly without
    # them -- extending real-stack coverage into payment/consultation
    # requires real Stripe test-mode and LiveKit credentials as repository
    # secrets, which this pass does not fabricate or silently substitute.
    name: Real-stack E2E (real backend + Postgres)
    runs-on: ubuntu-latest
    needs: verify
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: orivex
          POSTGRES_USER: orivex
          POSTGRES_PASSWORD: orivex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orivex -d orivex"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # env.schema.ts defaults PORT to 3000, not 4000 -- every step below
      # (the wait-loop, the frontend's NEXT_PUBLIC_API_BASE_URL, the spec
      # itself) assumes 4000, matching this repo's own local-dev
      # convention (.env.development). Without this, `node dist/main.js`
      # would bind 3000 and the wait-loop would fail this job every time.
      PORT: "4000"
      DATABASE_URL: postgresql://orivex:orivex@localhost:5432/orivex
      CORS_ORIGINS: http://localhost:3100
      FRONTEND_URL: http://localhost:3100
      JWT_ACCESS_SECRET: ci-only-placeholder-not-a-real-secret-32chars
      JWT_ACCESS_TTL_SECONDS: "900"
      PRESCRIPTION_SIGNING_SECRET: ci-only-placeholder-not-a-real-secret-32c
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY_ID: ci-placeholder
      S3_SECRET_ACCESS_KEY: ci-placeholder
      S3_BUCKET: ci-placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Install backend dependencies
        run: pnpm install --frozen-lockfile --filter @orivex/backend...

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile --filter @orivex/frontend...

      - name: Backend -- Prisma generate + migrate deploy
        run: |
          pnpm --filter @orivex/backend run prisma:generate
          pnpm --filter @orivex/backend run prisma:migrate:deploy

      - name: Backend -- seed demo data
        run: pnpm --filter @orivex/backend run seed

      - name: Backend -- build
        run: pnpm --filter @orivex/backend run build

      - name: Backend -- start (background)
        run: nohup node apps/backend/dist/main.js > backend.log 2>&1 &

      - name: Backend -- wait for real auth endpoint to answer
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:4000/auth/login \
              -H "Content-Type: application/json" -d '{"email":"nonexistent@orivex.dev","password":"wrong"}')
            if [ "$code" != "000" ]; then echo "Backend is up (auth endpoint responded $code)"; exit 0; fi
            sleep 2
          done
          echo "Backend never became reachable" && cat backend.log && exit 1

      - name: Frontend -- build (mocks disabled, pointed at the real backend above)
        run: pnpm --filter @orivex/frontend run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
          NEXT_PUBLIC_ENABLE_API_MOCKS: "false"

      - name: Install Playwright browsers
        run: pnpm --filter @orivex/frontend exec playwright install --with-deps chromium

      - name: Run real-stack smoke spec
        run: pnpm --filter @orivex/frontend exec playwright test real-stack-smoke.spec.ts
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
          NEXT_PUBLIC_ENABLE_API_MOCKS: "false"

      - name: Upload backend log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: real-stack-backend-log
          path: backend.log
          retention-days: 7

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-stack-playwright-report
          path: apps/frontend/playwright-report/
          retention-days: 7
