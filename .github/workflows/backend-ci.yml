name: Backend CI

# Sprint 13 -- Production & Deployment. Hard gates only, no deploy step:
# staging/production deploys are a separate, explicitly-gated concern
# (docs/13-engineering-bootstrap.md Section 11) -- this workflow never
# publishes an image or touches any environment.
on:
  push:
    branches: [main]
    paths:
      - "apps/backend/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "apps/backend/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/backend-ci.yml"

jobs:
  verify:
    name: Install, generate, lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable corepack (pnpm)
        run: corepack enable

      # --no-frozen-lockfile: pnpm-lock.yaml has not yet been regenerated to
      # reflect apps/backend/package.json's dependency move (`prisma` ->
      # dependencies, needed for `prisma migrate deploy` at container
      # startup -- see apps/backend/Dockerfile). Run `pnpm install` locally
      # once and commit the updated lockfile, then switch this back to
      # `--frozen-lockfile` for fully reproducible installs.
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --filter @orivex/backend...

      - name: Prisma generate
        run: pnpm --filter @orivex/backend run prisma:generate

      - name: Lint
        run: pnpm --filter @orivex/backend run lint

      - name: Typecheck
        run: pnpm --filter @orivex/backend run typecheck

      - name: Test
        run: pnpm --filter @orivex/backend run test

  docker-build:
    name: Docker build (verification only, no push)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: false
          tags: orivex-backend:ci
